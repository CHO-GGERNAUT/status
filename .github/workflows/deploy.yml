name: Deploy status page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.STATUS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: pnpm check

      - name: Apply production D1 migrations
        run: pnpm wrangler d1 migrations apply "$STATUS_D1_DATABASE_NAME" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_D1_DATABASE_NAME: ${{ vars.STATUS_D1_DATABASE_NAME }}

      - name: Deploy Pages
        run: >-
          pnpm wrangler pages deploy dist
          --project-name="$STATUS_PROJECT_NAME"
          --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_PROJECT_NAME: ${{ vars.STATUS_PROJECT_NAME }}
